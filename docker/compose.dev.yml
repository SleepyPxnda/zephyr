# Local development services: PostgreSQL 16 and Garage (S3-compatible object storage).
# Usage: docker compose -f docker/compose.dev.yml up -d
# Works without configuration; to override, add `--env-file .env` (see .env.example).
name: zephyr-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zephyr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zephyr}
      POSTGRES_DB: ${POSTGRES_DB:-zephyr}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zephyr} -d ${POSTGRES_DB:-zephyr}']
      interval: 5s
      timeout: 3s
      retries: 20

  # Single node without replication; creates the access key and the private
  # bucket from the GARAGE_DEFAULT_* variables on first start.
  garage:
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-4f1c2a9e8b7d6c5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-zephyr-dev-admin-token}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-zephyr}
    ports:
      - '${S3_PORT:-3900}:3900'
      - '${GARAGE_ADMIN_PORT:-3903}:3903'
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  garage-meta:
  garage-data:
