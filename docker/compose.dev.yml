# Local development services: PostgreSQL 16 and MinIO (S3).
# Usage: docker compose -f docker/compose.dev.yml up -d
# Works without configuration; to override, add `--env-file .env` (see .env.example).
name: zephyr-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zephyr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zephyr}
      POSTGRES_DB: ${POSTGRES_DB:-zephyr}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zephyr} -d ${POSTGRES_DB:-zephyr}']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-zephyr}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-zephyr-dev-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the private bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-zephyr}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-zephyr-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-zephyr}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET
      "

volumes:
  postgres-data:
  minio-data:
