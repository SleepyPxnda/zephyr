# Local development services: PostgreSQL 16. Object storage is an external S3 (e.g. Hetzner, see .env.example).
# Usage: docker compose -f docker/compose.dev.yml up -d
# Works without configuration; to override, add `--env-file .env` (see .env.example).
name: zephyr-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zephyr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zephyr}
      POSTGRES_DB: ${POSTGRES_DB:-zephyr}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zephyr} -d ${POSTGRES_DB:-zephyr}']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
